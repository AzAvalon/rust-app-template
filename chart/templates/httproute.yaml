{{- if .Values.ingress.enabled }}
{{- $_ := required "ingress.hostname is required when ingress is enabled" .Values.ingress.hostname }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
    {{- with .Values.ingress.route.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.ingress.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.gateway.enabled }}
  parentRefs:
    - name: {{ include "common.names.fullname" . }}
      namespace: {{ .Release.Namespace }}
      sectionName: {{ tpl (index .Values.ingress.gateway.listeners 0).name $ }}
  {{- else if .Values.ingress.route.parentRefs }}
  parentRefs:
    {{- range .Values.ingress.route.parentRefs }}
    - name: {{ tpl .name $ }}
      {{- if .namespace }}
      namespace: {{ tpl .namespace $ }}
      {{- end }}
      {{- if .sectionName }}
      sectionName: {{ tpl .sectionName $ | trim }}
      {{- end }}
    {{- end }}
  {{- end }}
  hostnames:
    - {{ tpl .Values.ingress.hostname $ | trim | quote }}
  {{- $prefix := tpl (.Values.ingress.route.pathPrefix | default "") $ | trim }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $prefix | default "/" | quote }}
      {{- if $prefix }}
      filters:
        # The app is served at the root: strip the prefix
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: "/"
      {{- end }}
      backendRefs:
        - name: {{ include "common.names.fullname" . }}
          port: {{ .Values.service.port }}
    {{- if .Values.ingress.route.extraRules }}
    {{- tpl (toYaml .Values.ingress.route.extraRules) . | nindent 4 }}
    {{- end }}
{{- end }}
