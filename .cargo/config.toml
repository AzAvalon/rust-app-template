[net]
git-fetch-with-cli = true # whether cargo uses git cli for git fetch

# x86_64 targets: x86-64-v3 = AVX2, FMA, BMI1/2, LZCNT, POPCNT, MOVBE, F16C
# (Haswell and newer).
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3"]

# Common baseline of AWS Graviton2/3/4, GitHub arm64 runners and Apple
# M-series (Docker linux/arm64). Inlines LSE atomics instead of the
# runtime-dispatched outline-atomics path.
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+lse,+rdm,+crc,+rcpc,+fp16,+dotprod"]
